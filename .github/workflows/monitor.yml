name: Socius kamer-monitor

# Deze workflow blijft zelf doorlopen: hij controleert Socius (alleen panden in
# Utrecht) elke minuut en start zichzelf na ca. 5 uur en 40 minuten opnieuw. Zo zijn we niet afhankelijk van
# de (onbetrouwbare) planning van GitHub. De cron hieronder is alleen een
# reserve om de lus weer op gang te brengen als hij ooit stopt.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Alleen een testmelding sturen"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: socius-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testmelding
        if: inputs.test_notify == true
        env:
          SOCIUS_USERNAME: ${{ secrets.SOCIUS_USERNAME }}
          SOCIUS_PASSWORD: ${{ secrets.SOCIUS_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO || 'robertmunnichs@gmail.com,jasmijnmunnichs@gmail.com' }}
        run: python monitor.py --test-notify

      - name: Elke minuut controleren (ca. 5u40)
        if: inputs.test_notify != true
        env:
          SOCIUS_USERNAME: ${{ secrets.SOCIUS_USERNAME }}
          SOCIUS_PASSWORD: ${{ secrets.SOCIUS_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO || 'robertmunnichs@gmail.com,jasmijnmunnichs@gmail.com' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + 340*60))
          while [ $SECONDS -lt $end ]; do
            echo "=== $(TZ=Europe/Amsterdam date '+%d-%m %H:%M') ==="
            python monitor.py || echo "controle mislukt, volgende keer opnieuw"
            if [ -n "$(git status --porcelain state.json aanbod_log.jsonl)" ]; then
              git add state.json aanbod_log.jsonl
              git commit -q -m "Update monitor-status"
              for i in 1 2 3; do
                git pull -q --rebase --autostash && git push -q && break
                sleep 5
              done
            fi
            sleep 60
          done

      - name: Opnieuw starten
        if: always() && inputs.test_notify != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml -R "$GITHUB_REPOSITORY" --ref main
