name: debug-dump (tijdelijk)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d && cd d
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          curl -sSL -A "$UA" https://www.vanderhuizen.com/provincies/utrecht/utrecht-1 -o list.html
          curl -sSL -A "$UA" https://www.vanderhuizen.com/huurwoningen/appartement-2-kamer/te-huur/utrecht-1/centrum/te-huur-zelfstandig-2-kamer-appartement-op-a-locatie -o detail.html
          curl -sSL -A "$UA" https://www.vanderhuizen.com/huurwoningen/kamer/te-huur/utrecht-1/te-huur-ruime-studentenkamer-in-zuilen -o detail2.html
          ls -la
          git init -q && git checkout -q -b debug-dump && git add . && git -c user.name=bot -c user.email=bot@x commit -qm dump
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" debug-dump
